Nano · 冻结</text><text x="235" y="211" font-size="16" fill="#34465b">手机 / 瓶 / 杯检测</text><rect x="470" y="150" width="330" height="85" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="635" y="184" font-size="20" font-weight="700" fill="#182b43">MediaPipe Hand · 冻结</text><text x="635" y="211" font-size="16" fill="#34465b">手部关键点 / 归属约束</text><rect x="870" y="150" width="330" height="85" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1035" y="184" font-size="20" font-weight="700" fill="#182b43">MediaPipe Face · 冻结</text><text x="1035" y="211" font-size="16" fill="#34465b">眼 / 嘴 / 面部关键点</text><rect x="280" y="315" width="700" height="85" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="630" y="349" font-size="20" font-weight="700" fill="#182b43">统一时空与有效性（扩展依赖掩码）</text><text x="630" y="376" font-size="16" fill="#34465b">缺失、过期、归属不明 → 无效；不伪造正常值</text><rect x="40" y="485" width="270" height="85" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="175" y="519" font-size="20" font-weight="700" fill="#182b43">F：面部状态流</text><text x="175" y="546" font-size="16" fill="#34465b">EAR / MAR / 闭眼与眨眼</text><rect x="350" y="485" width="270" height="85" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="485" y="519" font-size="20" font-weight="700" fill="#182b43">O：物体证据流</text><text x="485" y="546" font-size="16" fill="#34465b">类别 / 检测分数 / 有效零检测</text><rect x="660" y="485" width="270" height="85" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="795" y="519" font-size="20" font-weight="700" fill="#182b43">HO：手—物关系流</text><text x="795" y="546" font-size="16" fill="#34465b">距离 / IoU / 邻近持续时间</text><rect x="970" y="485" width="270" height="85" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1105" y="519" font-size="20" font-weight="700" fill="#182b43">FO：脸—物关系流</text><text x="1105" y="546" font-size="16" fill="#34465b">手机—脸 / 杯瓶—嘴距离</text><rect x="290" y="665" width="700" height="100" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="640" y="699" font-size="20" font-weight="700" fill="#182b43">轻量投影 + 因果 TCN（四流共享权重）</text><text x="640" y="726" font-size="16" fill="#34465b">各流独立编码；候选 T=100、D=16；输出 [B,4,16]</text><rect x="290" y="860" width="700" height="100" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="640" y="894" font-size="20" font-weight="700" fill="#182b43">任务级质量门控 × 4</text><text x="640" y="921" font-size="16" fill="#34465b">有效流内学习权重；输入时序表示 + 观测质量摘要</text><rect x="1030" y="665" width="270" height="100" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1165" y="699" font-size="20" font-weight="700" fill="#182b43">观测质量与可用性</text><text x="1165" y="726" font-size="16" fill="#34465b">有效比例 / 新鲜度</text><rect x="290" y="1055" width="700" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="640" y="1089" font-size="20" font-weight="700" fill="#182b43">四个独立行为头</text><text x="640" y="1116" font-size="16" fill="#34465b">疲劳 / 手机使用 / 饮水 / 分心（能力边界待验证）</text><rect x="290" y="1215" width="700" height="85" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="640" y="1249" font-size="20" font-weight="700" fill="#182b43">可用性检查 → 后续告警策略</text><text x="640" y="1276" font-size="16" fill="#34465b">证据不足输出 unavailable；不把缺失判为 SAFE</text><text x="690" y="1355" font-size="17" fill="#526174">蓝：复用现有感知基础　紫：新增训练层　黄：质量控制　绿：输入 / 输出</text></g></svg>
