<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>DriveGuard AI</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; }
      body {
        background: linear-gradient(135deg, #0b3b8c 0%, #1663d6 65%, #2f8bff 100%);
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        display: grid;
        place-items: center;
        user-select: none;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .logo {
        width: 88px; height: 88px; border-radius: 24px;
        background: rgba(255,255,255,.16);
        border: 1px solid rgba(255,255,255,.4);
        display: grid; place-items: center;
        font-size: 34px; font-weight: 700; letter-spacing: 2px;
      }
      .title { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
      .subtitle { font-size: 12px; opacity: .82; }
      .spinner {
        width: 22px; height: 22px; margin-top: 6px;
        border: 2px solid rgba(255,255,255,.28);
        border-top-color: #fff; border-radius: 50%;
        animation: spin .9s linear infinite;
      }
      .hint { font-size: 11px; opacity: .7; margin-top: 4px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">DG</div>
      <div class="title">DriveGuard AI</div>
      <div class="subtitle">驾安智护 · 危险驾驶安全检测</div>
      <div class="spinner"></div>
      <div class="hint">正在启动本地服务与模型连接…</div>
    </div>
  </body>
</html>
