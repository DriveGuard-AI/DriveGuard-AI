openapi: 3.1.0
info:
  title: DriveGuard AI REST API
  version: 0.2.0
  description: |
    DriveGuard AI MVP 的 REST 契约草案。当前仓库尚无后端实现；实现完成后应将
    FastAPI 生成的 OpenAPI 与本文件进行差异检查，并以评审确认的契约为准同步修订。
servers:
  - url: http://localhost:8000/api/v1
    description: Local edge device
tags:
  - name: system
  - name: monitoring
  - name: events
  - name: statistics
  - name: settings
  - name: models
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: API 进程健康检查
      security: []
      responses:
        "200":
          description: API 存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: 获取摄像头、推理、数据库和模型状态
      responses:
        "200":
          description: 当前系统状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          description: 无法形成有效状态响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /monitoring/snapshot:
    get:
      tags: [monitoring]
      operationId: getMonitoringSnapshot
      summary: 获取最新完整风险快照
      responses:
        "200":
          description: 最新风险快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: 当前没有活动监测会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PIPELINE_UNAVAILABLE，窗口预热、过期或证据不足，不能生成有效风险快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /monitoring/resume:
    post:
      tags: [monitoring]
      operationId: resumeMonitoring
      summary: 从离线回放切回实时采集（幂等）
      responses:
        "200":
          description: 管线状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineControlResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 分析任务仍在运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /monitoring/preview:
    get:
      tags: [monitoring]
      operationId: getMonitoringPreview
      summary: 获取显式启用的实时 MJPEG 预览
      description: >-
        需要 monitoring:read；preview.enabled 默认 false。使用 Authorization 鉴权，
        不在 URL 放 Token。仅内存实时编码，不落盘。慢客户端丢旧保新；
        已开始响应后的设备故障终止流，由客户端查询 system/status。
        每个 part 在 JPEG 前带 Content-Length、X-Seq、X-Timestamp-Ms、X-Sha256，
        描述该帧在推理输入中的位置与字节摘要；客户端不得重新编码后比对摘要。
        帧来源由 DGB_LIVE_SOURCE 决定（camera|frames）。
      responses:
        "200":
          description: multipart/x-mixed-replace; boundary=frame；每个 part 为 image/jpeg
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            multipart/x-mixed-replace:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: FORBIDDEN，权限不足或管理员未启用预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MONITORING_NOT_ACTIVE，没有活动会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PIPELINE_UNAVAILABLE，启动预览时摄像头或预览编码不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /monitoring/preview/state:
    get:
      tags: [monitoring]
      operationId: getMonitoringPreviewState
      summary: 获取预览开关、连接数与最近一帧的序号/摘要
      description: >-
        需要 monitoring:read。sequence/source_timestamp_ms/sha256 描述最近一帧
        已送进推理的画面；尚未收到帧时为 null，不得用 0 或空摘要代替。
      responses:
        "200":
          description: 预览状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewState"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: 分页查询危险事件
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/EventType"
        - name: risk_level
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: started_from
          in: query
          schema:
            type: string
            format: date-time
        - name: started_to
          in: query
          schema:
            type: string
            format: date-time
        - name: session_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 事件分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          description: 时间范围不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
  /events/{event_id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: 获取事件详情
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 事件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: 事件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /statistics/summary:
    get:
      tags: [statistics]
      operationId: getStatisticsSummary
      summary: 获取指定时间范围的事件统计
      parameters:
        - name: started_from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: started_to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: session_id
          in: query
          required: false
          description: 只看某个监测会话（离线分析每跑一次就多一个会话）。
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 统计摘要；无数据时返回零值和空趋势
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 获取系统配置
      responses:
        "200":
          description: 去敏后的系统配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 以乐观锁方式更新系统配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: 配置更新成功或相同请求的幂等结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUpdateResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 配置版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: 查询模型版本及激活状态
      parameters:
        - name: model_type
          in: query
          schema:
            type: string
            enum: [detector, landmarker, temporal, fusion]
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, active, retired, failed]
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersion"
        "401":
          $ref: "#/components/responses/AuthRequired"
  /analysis/jobs:
    get:
      tags: [analysis]
      operationId: listAnalysisJobs
      summary: 查询分析任务列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, completed, failed, cancelled]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分析任务分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobPage"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [analysis]
      operationId: createAnalysisJob
      summary: 用一份 JPEG 目录重新开始分析
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisJobCreate"
      responses:
        "201":
          description: 任务已创建并开始执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "400":
          description: 素材不可用（路径越界、无 JPEG、超上限或来源类型未支持）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /analysis/jobs/upload:
    post:
      tags: [analysis]
      operationId: uploadAnalysisJob
      summary: 上传视频，服务端抽帧后立即开始分析
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnalysisUploadRequest"
      responses:
        "201":
          description: 任务已创建并开始执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "400":
          description: 素材不可用（非视频、超大小/磁盘上限、参数不在栅格上、解码失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: 服务端缺少视频解码依赖
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/jobs/{job_id}:
    get:
      tags: [analysis]
      operationId: getAnalysisJob
      summary: 查询分析任务详情与进度
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [analysis]
      operationId: cancelAnalysisJob
      summary: 取消分析任务并结束其会话
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务已取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 任务已是终态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/jobs/{job_id}/evidence:
    get:
      tags: [analysis]
      operationId: getAnalysisEvidence
      summary: 回放坐标（逐 tick 风险曲线 + 事件帧区间）
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 回放证据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisEvidence"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/jobs/{job_id}/source:
    get:
      tags: [analysis]
      operationId: getAnalysisSource
      summary: 原始视频（仅保留原片的任务，支持 Range）
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "200":
          description: 视频字节流
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: 原视频未保留或已清理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/jobs/{job_id}/frames/{index}:
    get:
      tags: [analysis]
      operationId: getAnalysisFrame
      summary: 单帧 JPEG（逐帧回放）
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "200":
          description: JPEG 帧
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: 帧号越界或产物已清理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccessToken:
      name: access_token
      in: query
      required: false
      description: 媒体端点专用（<video>/<img> 无法带请求头，与 WS-001 同一取舍）。
      schema:
        type: string
  responses:
    AuthRequired:
      description: 缺少或无效凭证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 输入字段类型或范围错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 未分类内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RiskLevel:
      type: string
      enum: [SAFE, WARNING, DANGER]
    Quality:
      type: string
      enum: [good, degraded, unknown]
    EventType:
      type: string
      enum: [fatigue, phone_use, drinking, distraction, eyes_off_road, other]
    EventStatus:
      type: string
      enum: [active, ended, discarded]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service_version, time]
      properties:
        status:
          type: string
          const: ok
        service_version:
          type: string
        time:
          type: string
          format: date-time
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        message:
          type: [string, "null"]
        latency_ms:
          type: [number, "null"]
          minimum: 0
    PreviewState:
      type: object
      additionalProperties: false
      required:
        - enabled
        - available
        - clients
        - max_clients
        - max_fps
        - pipeline
        - source
        - frames_out
      properties:
        enabled:
          type: boolean
        available:
          type: boolean
          description: 当前是否可建立预览（开关、实时模式、已有帧、未达连接上限）
        clients:
          type: integer
          minimum: 0
        max_clients:
          type: integer
          minimum: 1
        max_fps:
          type: number
          minimum: 0.5
          maximum: 30
        pipeline:
          type: string
          enum: [realtime, playback, stopped]
        source:
          type: string
          enum: [camera, frames]
        device_index:
          type: [integer, "null"]
          minimum: 0
        sequence:
          type: [integer, "null"]
          minimum: 0
          description: 最近一帧送进推理的画面序号；未收到帧时为 null
        source_timestamp_ms:
          type: [integer, "null"]
          minimum: 0
        sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        bytes:
          type: [integer, "null"]
          minimum: 1
        age_ms:
          type: [number, "null"]
          minimum: 0
        frames_out:
          type: integer
          minimum: 0
        last_error:
          type: [string, "null"]
    SystemStatus:
      type: object
      additionalProperties: false
      required: [overall, camera, inference, database, model_bundle_version, observed_at]
      properties:
        overall:
          type: string
          enum: [ok, degraded, unavailable]
        camera:
          $ref: "#/components/schemas/ComponentStatus"
        inference:
          $ref: "#/components/schemas/ComponentStatus"
        database:
          $ref: "#/components/schemas/ComponentStatus"
        model_bundle_version:
          type: string
        fps:
          type: [number, "null"]
          minimum: 0
        observed_at:
          type: string
          format: date-time
    HeadPose:
      type: object
      additionalProperties: false
      required: [yaw, pitch, roll]
      properties:
        yaw: {type: number}
        pitch: {type: number}
        roll: {type: number}
    FeatureSnapshot:
      type: object
      additionalProperties: false
      properties:
        ear: {type: [number, "null"]}
        mar: {type: [number, "null"]}
        perclos: {type: [number, "null"], minimum: 0, maximum: 1}
        head_pose:
          oneOf:
            - $ref: "#/components/schemas/HeadPose"
            - type: "null"
    Detection:
      type: object
      additionalProperties: false
      required: [label, confidence, bbox]
      properties:
        label: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
    RiskScores:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
    TaskDetail:
      type: object
      additionalProperties: false
      required: [available]
      description: >-
        单任务判决参数（六参数 + 派生 margin）。判定依据是 logit >= threshold_logit，
        score 是未校准 sigmoid，仅供相对比较。available=false 时 logit/score/margin/detected
        必须为 null，不得补 0。
      properties:
        available: {type: boolean}
        logit: {type: [number, "null"]}
        score: {type: [number, "null"], minimum: 0, maximum: 1}
        threshold_logit: {type: [number, "null"]}
        margin:
          type: [number, "null"]
          description: logit - threshold_logit；>=0 已触发，<0 为安全余量
        detected: {type: [boolean, "null"]}
        source: {type: [string, "null"]}
        score_semantics: {type: [string, "null"]}
    RiskSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, session_id, sequence, captured_at, risk_level, confidence, quality, risk_scores, features, detections, reason_codes]
      properties:
        schema_version: {type: string, const: "1.0"}
        session_id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 0}
        captured_at: {type: string, format: date-time}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        primary_risk:
          oneOf:
            - $ref: "#/components/schemas/EventType"
            - type: "null"
        confidence: {type: number, minimum: 0, maximum: 1}
        quality: {$ref: "#/components/schemas/Quality"}
        risk_scores: {$ref: "#/components/schemas/RiskScores"}
        features: {$ref: "#/components/schemas/FeatureSnapshot"}
        detections:
          type: array
          items: {$ref: "#/components/schemas/Detection"}
        task_details:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TaskDetail"
          description: 四任务判决参数；结果过期或回放模式时为空
        reason_codes:
          type: array
          items: {type: string}
    Event:
      type: object
      additionalProperties: false
      required: [event_id, session_id, event_type, started_at, duration_ms, max_confidence, max_risk_level, status, quality, risk_scores, reason_codes, clip_available]
      properties:
        event_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        event_type: {$ref: "#/components/schemas/EventType"}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        duration_ms: {type: integer, minimum: 0}
        max_confidence: {type: number, minimum: 0, maximum: 1}
        max_risk_level: {$ref: "#/components/schemas/RiskLevel"}
        status: {$ref: "#/components/schemas/EventStatus"}
        quality: {$ref: "#/components/schemas/Quality"}
        risk_scores: {$ref: "#/components/schemas/RiskScores"}
        reason_codes:
          type: array
          items: {type: string}
        model_version_id: {type: [string, "null"], format: uuid}
        clip_available: {type: boolean}
    EventPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, has_next]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Event"}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        has_next: {type: boolean}
    TrendPoint:
      type: object
      required: [bucket_start, count]
      properties:
        bucket_start: {type: string, format: date-time}
        count: {type: integer, minimum: 0}
    StatisticsSummary:
      type: object
      additionalProperties: false
      required: [started_from, started_to, total_events, by_type, by_risk_level, trend]
      properties:
        started_from: {type: string, format: date-time}
        started_to: {type: string, format: date-time}
        session_id:
          type: [string, "null"]
          format: uuid
          description: 回显过滤条件；null 表示未按会话过滤。
        total_events: {type: integer, minimum: 0}
        by_type:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [event_type, count, total_duration_ms]
            properties:
              event_type: {type: string}
              count: {type: integer, minimum: 0}
              total_duration_ms: {type: integer, minimum: 0}
        by_risk_level:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [risk_level, count]
            properties:
              risk_level: {type: string, enum: [SAFE, WARNING, DANGER]}
              count: {type: integer, minimum: 0}
        trend:
          type: array
          items: {$ref: "#/components/schemas/TrendPoint"}
    SettingItem:
      type: object
      additionalProperties: false
      required: [key, value_type, version, requires_restart, is_secret, is_configured]
      properties:
        key: {type: string}
        value: {}
        value_type:
          type: string
          enum: [string, integer, number, boolean, object, array]
        version: {type: integer, minimum: 1}
        requires_restart: {type: boolean}
        is_secret: {type: boolean}
        is_configured: {type: boolean}
    SettingsResponse:
      type: object
      required: [version, items]
      properties:
        version: {type: integer, minimum: 1}
        items:
          type: array
          items: {$ref: "#/components/schemas/SettingItem"}
    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, changes]
      properties:
        version: {type: integer, minimum: 1}
        changes:
          type: object
          minProperties: 1
          additionalProperties: true
    SettingsUpdateResponse:
      type: object
      additionalProperties: false
      required: [version, applied, restart_required]
      properties:
        version: {type: integer, minimum: 1}
        applied:
          type: array
          items: {type: string}
        restart_required:
          type: array
          items: {type: string}
    ModelVersion:
      type: object
      additionalProperties: false
      required: [model_version_id, model_name, model_type, semantic_version, runtime, status, metrics]
      properties:
        model_version_id: {type: string, format: uuid}
        model_name: {type: string}
        model_type:
          type: string
          enum: [detector, landmarker, temporal, fusion]
        semantic_version: {type: string}
        runtime:
          type: string
          enum: [pytorch, onnxruntime, tensorrt, mediapipe, python]
        feature_schema_version: {type: [string, "null"]}
        status:
          type: string
          enum: [registered, active, retired, failed]
        metrics:
          type: object
          additionalProperties: true
    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field: {type: [string, "null"]}
        reason: {type: string}
    AnalysisJobStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    AnalysisSourceKind:
      type: string
      enum: [frames, camera, push]
      description: 当前仅支持 frames（媒体根目录下的 JPEG 序列目录）。
    AnalysisJobCreate:
      type: object
      additionalProperties: false
      required: [source_path]
      properties:
        source_kind:
          $ref: "#/components/schemas/AnalysisSourceKind"
        source_path:
          type: string
          description: 必须位于服务端媒体根目录之下。
        force:
          type: boolean
          default: false
          description: 实时监控在跑时必须为 true，否则返回 409 MONITORING_ACTIVE。
    AnalysisUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 视频文件，后缀限 mp4/mov/avi/mkv/webm/m4v。
        step_ms:
          type: integer
          enum: [40, 80, 120, 160, 200]
          default: 40
          description: 抽帧步长，必须是 25 Hz 栅格（40 ms）的整数倍。
        size:
          type: string
          default: 1280x720
          description: 输出尺寸 WxH，宽高必须为偶数。
        quality:
          type: integer
          minimum: 1
          maximum: 100
          default: 85
        retain_source:
          type: boolean
          default: false
          description: 是否保留原始视频（NFR-003 默认不保留）；保留时可用 <video> 回放。
        force:
          type: boolean
          default: false
          description: 实时监控在跑时必须为 true，否则返回 409 MONITORING_ACTIVE（不会开始抽帧）。
    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        [job_id, session_id, source_kind, source_path, status, frames_total,
         frames_done, step_ms, timeline_ms, source_available, created_at, updated_at]
      properties:
        job_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        source_kind: {$ref: "#/components/schemas/AnalysisSourceKind"}
        source_path: {type: string}
        source_sha256: {type: [string, "null"]}
        status: {$ref: "#/components/schemas/AnalysisJobStatus"}
        frames_total: {type: integer, minimum: 0}
        frames_done: {type: integer, minimum: 0}
        step_ms: {type: integer, minimum: 1, default: 40}
        timeline_ms: {type: integer, minimum: 0}
        source_available: {type: boolean}
        error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        updated_at: {type: string, format: date-time}
    RiskPoint:
      type: object
      additionalProperties: false
      required: [ms, frame, risk_level]
      properties:
        ms: {type: integer, minimum: 0}
        frame: {type: integer, minimum: 0}
        risk_level: {$ref: "#/components/schemas/RiskLevel"}
        primary_risk: {type: [string, "null"]}
        confidence: {type: number, minimum: 0, maximum: 1}
    EvidenceEvent:
      type: object
      additionalProperties: false
      required: [event_id, event_type, risk_level, started_ms, ended_ms, start_frame, end_frame, duration_ms]
      properties:
        event_id: {type: string}
        event_type: {type: string}
        risk_level: {type: string}
        started_ms: {type: integer, minimum: 0}
        ended_ms: {type: integer, minimum: 0}
        start_frame: {type: integer, minimum: 0}
        end_frame: {type: integer, minimum: 0}
        duration_ms: {type: integer, minimum: 0}
    AnalysisEvidence:
      type: object
      additionalProperties: false
      required: [job_id, session_id, step_ms, frames_total, duration_ms, source_available, source_kind]
      properties:
        job_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        step_ms: {type: integer, minimum: 1}
        frames_total: {type: integer, minimum: 0}
        duration_ms: {type: integer, minimum: 0}
        source_available: {type: boolean}
        source_kind: {$ref: "#/components/schemas/AnalysisSourceKind"}
        timeline:
          type: array
          items: {$ref: "#/components/schemas/RiskPoint"}
        events:
          type: array
          items: {$ref: "#/components/schemas/EvidenceEvent"}
    PipelineControlResponse:
      type: object
      additionalProperties: false
      required: [state, playback]
      properties:
        state: {type: string}
        playback:
          type: boolean
          description: false 表示当前跑的是实时实现（不是离线素材回放）。
        session_id: {type: [string, "null"], format: uuid}
    AnalysisJobPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, has_next]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AnalysisJob"}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        has_next: {type: boolean}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        details:
          type: array
          items: {$ref: "#/components/schemas/ErrorDetail"}
        request_id: {type: string, format: uuid}
